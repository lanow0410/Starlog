<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Starlog Login</title>

  <link
    rel="stylesheet"
    as="style"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
  />

  <link rel="stylesheet" href="./css/login.css" />
</head>

<body>

  <div class="app">

    <!-- HEADER -->
    <header class="header">

      <button class="close-btn">
        <img src="./icons/exit.svg" alt="닫기" />
      </button>

    </header>

    <!-- content -->
    <main class="content">
        <div class="hero">
            <img src="./img/login.png" alt="hero" />
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">

      <button class="login-btn">
        <div class="login-icon"><img src="./icons/Apple Logo.png" alt="apple" /></div>
        <span>애플 계정으로 로그인</span>
      </button>

      <button class="login-btn">
        <div class="login-icon"><img src="./icons/Phone Logo.png" alt="phone" /></div>
        <span>휴대폰번호로 로그인</span>
      </button>


      <button class="signup-btn">
        새로운 계정 만들기
      </button>

    </footer>

  </div>

</body>
</html>
