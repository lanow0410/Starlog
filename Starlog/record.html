<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>분석 리포트</title>
    <link rel="stylesheet" href="./css/commonHeader.css">
    <link rel="stylesheet" href="css/record.css">
</head>

<body>

    <div class="app">

        <!-- HEADER -->
        <div id="common-header-menu"></div>

        <section class="record-section">
            <!-- 뒤로가기 -->
            <div class="record-top">
                <button class="back-btn">
                    <img src="./icons/back.svg" alt="back">
                </button>

                <h1>나의 기록</h1>

                <div class="record-top-space"></div>
            </div>

            <div class="search-area">
                <div class="search-box">
                    <img src="icons/search.svg" alt="">
                    <input type="text" placeholder="검색 내용 입력">
                </div>

                <button class="filter-btn">
                    <img src="icons/filter.svg" alt="">
                </button>

                <div class="selected-filters" id="selectedFilters">
                    <div class="selected-list" id="selectedList"></div>
                </div>
            </div>


            <div class="diary-list" id="diaryList">
                <!-- localStorage 기록이 여기에 생성됨 -->
            </div>


            <!-- Filter Modal -->
            <div class="filter-modal" id="filterModal">

                <!-- 어두운 배경 -->
                <div class="filter-overlay"></div>

                <!-- Bottom Sheet -->
                <div class="filter-sheet">

                    <!-- 기간 -->
                    <div class="filter-group">

                        <h3>📅 기간</h3>

                        <div class="chip-wrap">
                            <button class="chip active">전체</button>
                            <button class="chip">최근 1개월</button>
                            <button class="chip">최근 6개월</button>
                            <button class="chip">1년 이상</button>
                        </div>

                    </div>

                    <!-- 감정 -->
                    <div class="filter-group">

                        <h3>📝 감정</h3>

                        <div class="chip-wrap">
                            <button class="chip active">전체</button>
                            <button class="chip">행복</button>
                            <button class="chip">애정</button>
                            <button class="chip">평온</button>
                            <button class="chip">안정</button>
                            <button class="chip">스트레스</button>
                        </div>

                    </div>

                    <div class="filter-bottom">

                        <button class="reset-btn">
                            초기화
                        </button>

                        <button class="apply-btn">
                            적용하기
                        </button>

                    </div>

                </div>

            </div>

        </section>



        <footer>
            <div class="footer-logo">Starlog</div>
            <div class="copyright">
                Copyright ⓒ 2026, Starlog All rights reserved.
            </div>
        </footer>

    </div>
    <script src="./js/commonHeader.js"></script>
    <script src="js/recode.js"></script>
</body>

</html>
