<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starlog</title>
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="./css/peristalsis.css" />
</head>

<body>

    <div class="app">

        <!-- HEADER -->
        <header class="header">
            <button class="logo" onclick="location.href='main.html'">
                <img src="icons/HeaderLogo.svg" alt="로고" />
            </button>
            <button class="close-btn"><img src="icons/exit.svg" alt="종료버튼" /></button>
        </header>

        <!-- 중앙 정렬 콘텐츠 (가로 342px로 통일) -->
        <main class="sync-main-content">
            <div class="sync-graphic-container">

                <!-- 1. 맨 밑바탕: 큰 흰색 원 -->
                <div class="layer-white"></div>

                <!-- 2. 중간: 마름모꼴로 돌아가는 초록색 링 -->
                <div class="layer-green-spin"></div>

                <!-- 3. 위: 안쪽을 파내어 빈 바를 만들어줄 검은색 작은 원 (앱 배경색 매칭) -->
                <div class="layer-dark-mask"></div>

                <!-- 4. 맨 위: 메인 캐릭터 이미지 -->
                <img class="sync-main-img" src="./icons/runa.svg" alt="연동 로고" />

            </div>

            <h2 class="syncing-status-title">서비스 연동중...</h2>

            <!-- 가로 중앙 정렬된 취소 버튼 -->
            <button type="button" class="sync-cancel-btn" onclick="history.back()">연동 취소하기</button>
        </main>
    </div>
    <script src="js/landing.js"></script>
</body>

</html>
