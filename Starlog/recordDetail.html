<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기록 상세</title>
    <link rel="stylesheet" href="./css/commonHeader.css">
    <link rel="stylesheet" href="css/recordDetail.css">
</head>

<body>

    <div class="app">

        <!-- ================= HEADER ================= -->

        <!-- HEADER -->
        <div id="common-header-menu"></div>

        <!-- ================= DETAIL ================= -->

        <section class="detail-section">

            <!-- 제목 -->

            <div class="detail-top">

                <button class="back-btn">
                    <img src="icons/back.svg" alt="">
                </button>

                <h1 id="detailTitle">제목 영역</h1>

                <div class="top-space"></div>

            </div>

            <!-- 프린터 버튼 -->

            <div class="printer-area">
                <button class="printer-btn">
                    <img src="icons/printer.svg" alt="">
                </button>
            </div>

            <!-- 대표 이미지 -->

            <div class="detail-image">

                <img id="detailImage" src="https://placehold.co/452x254" alt="기록 이미지">

                <button class="image-edit-btn">
                    <img src="icons/edit.svg" alt="">
                </button>

            </div>

            <!-- 기록 내용 -->

            <article class="detail-card">

                <div class="card-title">
                    기록 내용
                </div>

                <p class="detail-content" id="detailContent">
                    기록 내용을 불러오는 중...
                </p>

            </article>

            <!-- 선택된 카테고리 -->

            <article class="detail-card">

                <div class="card-title">
                    선택된 카테고리
                </div>

                <div class="category-list">

                    <div class="category-item active">

                        <div class="emotion-circle">
                            <img src="icons/Joy.png" alt="">
                        </div>

                        <span>행복</span>

                    </div>

                    <div class="category-item">

                        <div class="emotion-circle">
                            <img src="icons/Love.png" alt="">
                        </div>

                        <span>애정</span>

                    </div>

                    <div class="category-item">

                        <div class="emotion-circle">
                            <img src="icons/Peace.png" alt="">
                        </div>

                        <span>평온</span>

                    </div>

                    <div class="category-item">

                        <div class="emotion-circle">
                            <img src="icons/Stable.png" alt="">
                        </div>

                        <span>안정</span>

                    </div>

                    <div class="category-item">

                        <div class="emotion-circle">
                            <img src="icons/Stress.png" alt="">
                        </div>

                        <span>스트레스</span>

                    </div>

                </div>

            </article>

            <!-- 태그 -->

            <article class="detail-card">

                <div class="card-title">
                    선택된 태그
                </div>

                <div class="tag-list" id="detailTags"></div>

            </article>

            <!-- 버튼 -->

            <div class="button-group">

                <button class="delete-btn">
                    삭제
                </button>

                <button class="edit-btn">
                    기록 수정하기
                </button>

            </div>

            <!-- 관련 기록 -->

            <div class="related-top">

                <div>

                    <h2>관련 기록</h2>

                    <p>유사한 성격의 기록을 모아봤어요</p>

                </div>

                <span class="page-count" id="relatedCount">
                    0 / 0
                </span>

            </div>

            <div class="related-list" id="relatedList">
                <!-- JS가 생성 -->
            </div>

            <!-- 메인으로 -->

            <button class="main-btn">
                메인으로
            </button>

        </section>

        <!-- ================= FOOTER ================= -->

        <footer>

            <div class="footer-logo">
                Starlog
            </div>

            <div class="copyright">
                Copyright ⓒ 2026, Starlog All rights reserved.
            </div>

        </footer>

    </div>
    <script src="./js/commonHeader.js"></script>
    <script src="./js/recordDetail.js"></script>
</body>

</html>
