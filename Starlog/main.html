<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Starlog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./commonHeader.css">
  <link rel="stylesheet" href="./css/main.css" />
</head>

<body>

  <div class="app">

    <!-- HEADER -->
    <div id="common-header-menu"></div>

    <!-- FILTER -->
    <section class="filter-wrap">
      <button class="chip active">5월 12일</button>
      <button class="chip">미확인 별자리</button>
    </section>

    <!-- HERO -->
    <section class="hero">
      <img src="./img/Sample1.png" alt="">
    </section>

    <!-- SUB TEXT -->
    <section class="sub-banner">
      오늘은 어떤 별자리를 만나게 될까요?
    </section>

    <!-- REPORT -->
    <section class="section-header">
      <h2>분석 리포트</h2>

      <button class="view-all">
        전체보기
      </button>
    </section>

    <!-- INSIGHT -->
    <section class="card insight-card">
      <h3>오늘의 인사이트</h3>

      <p>
        어제보다 3개의 별이 더 추가되며 하루의 별자리가 더욱 풍부해졌어요.
        특히 행복한 순간이 하나 추가되며 오늘의 흐름에 따듯한 변화가 더해졌어요.
      </p>
    </section>

    <!-- STATS -->
    <section class="stats">
      <div class="card stat-card">
        <strong>247</strong>
        <span>총 기록수</span>
      </div>

      <div class="card stat-card">
        <strong>5</strong>
        <span>오늘 추가됨</span>
      </div>
    </section>

    <!-- ARCHIVE -->
    <section class="section-header">
      <h2>최근 아카이브</h2>

      <button class="view-all">
        전체보기
      </button>
    </section>

    <section class="archive-list">

      <button class="card archive-card">
        <div class="archive-top">
          <div class="avatar"><img src="./icons/Joy.png" alt="Joy" /></div>

          <div class="meta">
            <span class="title">행복</span>
            <span class="dot">·</span>
            <span class="date">26년 4월 12일</span>
          </div>
        </div>

        <p>
          이번주 활동량이 30% 증가했어요.
          활동 내역 중 행복한 감정의 기록이 대폭 상승해 추가되었어요
        </p>

        <div class="tags">
          <span>Instagram</span>
          <span>Instagram</span>
        </div>
      </button>

      <button class="card archive-card">
        <div class="archive-top">
          <div class="avatar"><img src="./icons/Joy.png" alt="Joy" /></div>

          <div class="meta">
            <span class="title">행복</span>
            <span class="dot">·</span>
            <span class="date">26년 4월 12일</span>
          </div>
        </div>

        <p>
          집에서 좋아하는 영상을 보면서 편히 쉬었다.
          별거 아닌데 힐링되는 기분
        </p>

        <div class="tags">
          <span>Instagram</span>
          <span>Instagram</span>
        </div>
      </button>

    </section>

    <!-- CATEGORY -->
    <section class="section-header single">
      <h2>카테고리별 아카이브</h2>
    </section>

    <section class="category-scroll">

      <button class="category-card">
        <div class="category-icon yellow"><img src="./icons/Joy.png" alt="Joy" /></div>
        <span>행복</span>
      </button>

      <button class="category-card">
        <div class="category-icon pink"><img src="./icons/Love.png" alt="Love" /></div>
        <span>애정</span>
      </button>

      <button class="category-card">
        <div class="category-icon blue"><img src="./icons/Calm.png" alt="Calm" /></div>
        <span>평온</span>
      </button>

      <button class="category-card">
        <div class="category-icon green"><img src="./icons/Peace.png" alt="Peace" /></div>
        <span>안정</span>
      </button>

      <button class="category-card">
        <div class="category-icon orange"><img src="./icons/Stress.png" alt="Stress" /></div>
        <span>스트레스</span>
      </button>

    </section>

    <!-- CONSTELLATION -->
    <section class="section-header single">
      <h2>별자리 도감</h2>
    </section>

    <button class="card constellation-card">
      <div class="constellation-icon">
        <img src="./icons/constellation.svg" alt="Constellation" />
      </div>

      <div class="constellation-content">
        <h3>별자리 도감</h3>
        <p>기록된 별자리를 살펴보세요</p>
      </div>

      <div class="arrow">
        <img src="./icons/arrow.svg" alt="Arrow" />
      </div>
    </button>

    <!-- FLOAT -->
    <button class="floating-btn">
      +
    </button>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="footer-logo">Starlog</div>

      <p>
        Copyright ⓒ 2026, Starlog All rights reserved.
      </p>
    </footer>

  </div>
  <script src="./js/commonHeader.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
